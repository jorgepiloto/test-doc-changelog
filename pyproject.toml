[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "test-doc-changelog"
version = "0.1.0"
description = "Sandbox for validating the doc-changelog action."

[tool.towncrier]
directory = "doc/changelog.d-pyproject"
template = "doc/changelog.d-pyproject/changelog_template.jinja"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true
